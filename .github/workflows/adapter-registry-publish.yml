name: Publish Adapter Registry

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adapter-registry-pages
  cancel-in-progress: false

env:
  REGISTRY_BASE_URL: ${{ vars.ADAPTER_REGISTRY_BASE_URL || 'https://luberserker0v0.github.io/comic-crawler' }}
  REGISTRY_ID: ${{ vars.ADAPTER_REGISTRY_ID || 'official' }}
  REGISTRY_KEY_ID: ${{ vars.ADAPTER_REGISTRY_KEY_ID || 'comiccrawler-official-2026-10' }}

jobs:
  build:
    name: Build signed registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Validate release inputs
        shell: bash
        run: |
          find registry/packages -type f -name '*.ccadapter.json' -print -quit | grep -q . || {
            echo 'No reviewed *.ccadapter.json files exist in registry/packages.' >&2
            exit 1
          }

      - name: Prepare signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.ADAPTER_REGISTRY_PRIVATE_KEY }}
        run: |
          test -n "$SIGNING_KEY" || {
            echo 'ADAPTER_REGISTRY_PRIVATE_KEY is not configured.' >&2
            exit 1
          }
          umask 077
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/adapter-registry-private.pem"

      - name: Build signed registry
        shell: bash
        run: |
          RELEASE_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          npm run -w backend cli -- adapter-registry publish ../registry/packages \
            --output ../.artifacts/adapter-registry \
            --registry-id "$REGISTRY_ID" \
            --base-url "$REGISTRY_BASE_URL" \
            --key-id "$REGISTRY_KEY_ID" \
            --private-key "$RUNNER_TEMP/adapter-registry-private.pem" \
            --timestamp "$RELEASE_TIMESTAMP"
          npm run -w backend cli -- adapter-registry public-key \
            --private-key "$RUNNER_TEMP/adapter-registry-private.pem" \
            --output ../.artifacts/adapter-registry/public-key.pem

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .artifacts/adapter-registry

  deploy:
    name: Deploy signed registry
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
