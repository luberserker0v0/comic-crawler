name: Verify Quick

on:
  push:
  pull_request:

jobs:
  verify-quick:
    name: npm run verify:quick
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quick verification gate
        run: npm run verify:quick

      - name: Run typecheck (shared + workspaces)
        run: npm run typecheck

      # Frontend lint is not gated yet: pages/* have pre-existing
      # react-hooks violations (setState-in-effect) that need a dedicated
      # cleanup pass with the giant pages split up first.
      - name: Run lint (backend + shared)
        run: npm run lint --workspace backend --workspace shared

      # Full backend unit suite (60 suites). verify:quick only runs the core
      # subset via test:core; this step covers the rest. scripts/
      # verify-core-tests.mjs fails closed on untracked test files so new
      # tests cannot silently fall outside both gates.
      - name: Run full backend unit tests
        run: npm run -w backend test -- --runInBand

      - name: Upload diagnostic artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-quick-diagnostics
          if-no-files-found: ignore
          path: |
            test-results/
            playwright-report/
            backend/coverage/
            frontend/coverage/
            .tmp-dev-logs/
