name: comiccrawler

services:
  app:
    image: '${COMICCRAWLER_IMAGE:-luberserker/comiccrawler}:${COMICCRAWLER_IMAGE_TAG:-latest}'
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMICCRAWLER_VERSION: '${COMICCRAWLER_IMAGE_VERSION:-0.2.0}'
        COMICCRAWLER_REVISION: '${COMICCRAWLER_IMAGE_REVISION:-local}'
    container_name: comiccrawler
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    ports:
      # Host port defaults to 4100. If Windows/Hyper-V reserves it
      # (netsh int ipv4 show excludedportrange), override with e.g.
      # COMICCRAWLER_HOST_PORT=4200 (via environment or a local .env file).
      - '${COMICCRAWLER_HOST_PORT:-4100}:4100'
    environment:
      - NODE_ENV=production
      - COMICCRAWLER_HOST=0.0.0.0
      - COMICCRAWLER_PORT=4100
      - COMICCRAWLER_DATA_PATH=/app/data
      - STATIC_DIR=/app/static
      - AO_BUNDLE_PATH=/app/agent/ao/selector-discovery
    volumes:
      - comic-data:/app/data
      - comic-downloads:/app/downloads
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4100/api/status').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

volumes:
  comic-data:
    driver: local
  comic-downloads:
    driver: local
