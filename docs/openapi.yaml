openapi: 3.1.0
info:
  title: ComicCrawler REST API
  version: 0.2.0
  description: REST contract for ComicCrawler clients. Access may be public or protected by the configured API security policy.
servers:
  - url: http://127.0.0.1:4100
security:
  - {}
  - userBearerAuth: []
    userIdHeader: []
paths:
  /api/status:
    get:
      summary: Health and runtime status
      security: []
      responses:
        "200":
          description: Server status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/adapters:
    get:
      summary: List registered adapters
      responses:
        "200":
          description: Adapter list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AdapterListItem"
  /api/adapters/resolve:
    post:
      summary: Resolve which adapter can handle a URL and mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdapterResolveRequest"
      responses:
        "200":
          description: Adapter resolution result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdapterResolveResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/adapters/chapter-images:
    post:
      summary: Extract stable chapter page descriptors
      description: Resolves a compatible adapter unless adapterId is supplied, then returns an opaque deterministic chapter ID and the complete ordered page descriptors without creating a download task. imageUrlCount always equals imageUrls.length and images.length; images.map(image => image.url) exactly equals imageUrls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterImagesRequest"
      responses:
        "200":
          description: Complete chapter image URL result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChapterImagesResponse"
              example:
                data:
                  adapterId: site-adapter
                  chapterUrl: https://comic.example/manga/example/chapter-10
                  chapter:
                    id: chapter_nL7pRZ7Yf0tY02mI1y9lNrPq
                    canonicalUrl: https://comic.example/manga/example/chapter-10
                    stability: deterministic
                    identitySource: normalized-url
                  imageUrlCount: 2
                  imageUrls:
                    - https://cdn.example/001.jpg
                    - https://cdn.example/002.jpg
                  images:
                    - id: page_XPtJJLh5Qm8kQ9V4yO0fYm2n
                      orderIndex: 0
                      url: https://cdn.example/001.jpg
                    - id: page_qAsSNF3rNz7L1H9sK5b0mV2x
                      orderIndex: 1
                      url: https://cdn.example/002.jpg
                  domSource: static
                  durationMs: 42
                  renderContext:
                    viewport:
                      width: 390
                      height: 844
                    deviceScaleFactor: 3
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Human verification is required before chapter images can be extracted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterImagesVerificationRequiredError"
        "422":
          $ref: "#/components/responses/Error"
  /api/adapters/deleted:
    get:
      summary: List deleted adapters
      responses:
        "200":
          description: Deleted adapters and restore availability
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          adapters:
                            type: array
                            items:
                              type: object
                              required: [adapterId, deletedAt, restorable, restoreReason]
                              properties:
                                adapterId:
                                  type: string
                                deletedAt:
                                  type: string
                                implementationKind:
                                  type: string
                                sourcePath:
                                  type: string
                                sourceDirectory:
                                  type: string
                                sourceDeleted:
                                  type: boolean
                                sourceExists:
                                  type: boolean
                                restorable:
                                  type: boolean
                                restoreReason:
                                  type: string
  /api/adapters/{id}:
    get:
      summary: Read adapter detail
      parameters:
        - $ref: "#/components/parameters/AdapterId"
      responses:
        "200":
          description: Adapter detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdapterListItem"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a registered adapter
      description: Deactivates a catalog-managed adapter while retaining immutable approved versions. For project TypeScript adapters, deletes the adapter source directory as a project code change.
      parameters:
        - $ref: "#/components/parameters/AdapterId"
      responses:
        "200":
          description: Adapter deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [adapterId, message, registryRemoved, catalogDeactivated, deletedMarkerWritten, sourceDeleted]
                        properties:
                          adapterId:
                            type: string
                          message:
                            type: string
                          implementationKind:
                            type: string
                          registryRemoved:
                            type: boolean
                          catalogDeactivated:
                            type: boolean
                          deletedMarkerWritten:
                            type: boolean
                          sourcePath:
                            type: string
                          sourceDirectory:
                            type: string
                          sourceDeleted:
                            type: boolean
        "404":
          $ref: "#/components/responses/Error"
  /api/adapters/{id}/restore:
    post:
      summary: Restore a deleted adapter
      description: Restores a catalog-managed adapter from its last approved version, or restores a project-source adapter only after its source exists again.
      parameters:
        - $ref: "#/components/parameters/AdapterId"
      responses:
        "200":
          description: Adapter restored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [adapterId, message, restored]
                        properties:
                          adapterId:
                            type: string
                          message:
                            type: string
                          implementationKind:
                            type: string
                          restored:
                            type: boolean
                          sourcePath:
                            type: string
                          sourceDirectory:
                            type: string
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/adapters/{id}/rollback:
    post:
      summary: Roll back a catalog-managed adapter
      description: Activates the requested immutable approved version, or the previous version when version is omitted.
      parameters:
        - $ref: "#/components/parameters/AdapterId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: string
      responses:
        "200":
          description: Adapter version activated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [adapterId, activeVersion, rolledBack]
                        properties:
                          adapterId:
                            type: string
                          activeVersion:
                            type: string
                          rolledBack:
                            type: boolean
        "400":
          $ref: "#/components/responses/Error"
  /api/adapters/{id}/versions:
    get:
      summary: List approved catalog versions
      parameters:
        - $ref: "#/components/parameters/AdapterId"
      responses:
        "200":
          description: Catalog entry and active version pointer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdapterCatalogEntry"
        "404":
          $ref: "#/components/responses/Error"
  /api/adapters/{id}/versions/{version}/package:
    get:
      summary: Export an immutable adapter package
      parameters:
        - $ref: "#/components/parameters/AdapterId"
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exact stored package document
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdapterPackageDocument"
        "404":
          $ref: "#/components/responses/Error"
  /api/adapter-packages/import:
    post:
      summary: Validate and import an adapter package
      description: Import is inactive by default. Set activate only after explicit developer review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document:
                  $ref: "#/components/schemas/AdapterPackageDocument"
                activate:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Package validation and catalog installation result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdapterPackageImportResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/adapter-registry/packages:
    get:
      summary: Verify and list packages from trusted adapter registries
      responses:
        "200":
          description: Verified remote packages and local installation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdapterRegistryUpdateListResponse"
        "422":
          $ref: "#/components/responses/Error"
  /api/adapter-registry/updates:
    get:
      summary: List newest verified packages not installed locally
      parameters:
        - in: query
          name: adapterId
          schema:
            type: string
      responses:
        "200":
          description: Available updates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdapterRegistryUpdateListResponse"
        "422":
          $ref: "#/components/responses/Error"
  /api/adapter-registry/install:
    post:
      summary: Download, verify, and install one official adapter package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdapterRegistryInstallRequest"
      responses:
        "200":
          description: Installed package; inactive unless explicitly requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdapterRegistryUpdateResponse"
        "422":
          $ref: "#/components/responses/Error"
  /api/adapter-registry/update:
    post:
      summary: Install newest missing signed adapter packages
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                adapterId:
                  type: string
                activate:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Installed updates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdapterRegistryUpdateListResponse"
        "422":
          $ref: "#/components/responses/Error"
  /api/adapters/{id}/capabilities:
    get:
      summary: Read Adapter Lab capabilities and function descriptors
      parameters:
        - $ref: "#/components/parameters/AdapterId"
      responses:
        "200":
          description: Adapter capability detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          $ref: "#/components/responses/Error"
  /api/adapters/{id}/implementation:
    get:
      summary: Read full Adapter Lab implementation source or manifest
      parameters:
        - $ref: "#/components/parameters/AdapterId"
      responses:
        "200":
          description: Adapter implementation artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          $ref: "#/components/responses/Error"
  /api/adapters/{id}/functions/{functionId}/test:
    post:
      summary: Run an Adapter Lab function test
      description: Metadata functions expect manga catalog URLs. Chapter image functions expect chapter URLs.
      parameters:
        - $ref: "#/components/parameters/AdapterId"
        - $ref: "#/components/parameters/FunctionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdapterFunctionTestRequest"
      responses:
        "200":
          description: Function test result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdapterFunctionTestResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/tasks:
    get:
      summary: List tasks
      responses:
        "200":
          description: Task list and stats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TaskListResponse"
    post:
      summary: Create a crawl task or queue adapter/verification preparation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CreateTaskResponse"
        "202":
          description: Selector discovery or verification handoff queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CreateTaskResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/tasks/{id}:
    get:
      summary: Read task detail, checkpoint, result, and preview metadata
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TaskDetailResponse"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a terminal or waiting-verification task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "400":
          $ref: "#/components/responses/Error"
  /api/tasks/{id}/resume:
    post:
      summary: Resume a paused, interrupted, failed, or waiting-verification task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "409":
          description: Human verification handoff is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          $ref: "#/components/responses/Error"
  /api/tasks/{id}/rebind-browser-target:
    post:
      summary: Explicitly recover an existing-tab task after its Browser Client process restarts
      description: >-
        Replaces a process-scoped existing-tab Worker and resource only after the
        caller explicitly approves and registers the page again. The expected
        target provides optimistic concurrency protection. No Worker is selected
        automatically.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RebindBrowserTargetRequest"
      responses:
        "200":
          description: Browser Target rebound, or the same recovery request was replayed idempotently
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RebindBrowserTargetResponse"
        "400":
          description: Invalid target, unavailable resource, URL mismatch, or insufficient capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The authenticated user does not own the task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Stale expected target or non-recoverable task state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          $ref: "#/components/responses/Error"
  /api/tasks/{id}/preview-file:
    get:
      summary: Read a downloaded image preview file
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image file stream
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /api/selector-discovery/{id}:
    get:
      summary: Read selector discovery job
      parameters:
        - $ref: "#/components/parameters/DiscoveryId"
      responses:
        "200":
          description: Selector discovery job
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SelectorDiscoveryJob"
        "404":
          $ref: "#/components/responses/Error"
  /api/selector-discovery/{id}/promote:
    post:
      summary: Capture a golden fixture and promote a reviewed TypeScript adapter draft
      description: Fetches the reviewed rendered page through the task-bound Browser Worker, stores page.html and expected.json, and registers the adapter only after fixture capture succeeds.
      parameters:
        - $ref: "#/components/parameters/DiscoveryId"
      responses:
        "200":
          description: Promoted TypeScript adapter implementation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdapterPackageManifest"
        "400":
          $ref: "#/components/responses/Error"
  /api/fixtures/{domain}/{id}/verify-approved-adapter:
    post:
      summary: Replay an approved adapter fixture
      description: Runs every function recorded in expected.json against page.html and compares the complete normalized result.
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adapterId]
              properties:
                adapterId:
                  type: string
      responses:
        "200":
          description: Fixture replay result; passed is false when output differs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [fixture, passed, expected, actual]
                        properties:
                          fixture:
                            $ref: "#/components/schemas/FixtureSummary"
                          passed:
                            type: boolean
                          expected:
                            type: object
                            additionalProperties: true
                          actual:
                            type: object
                            additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/challenge-discovery/{id}:
    get:
      summary: Read a human verification handoff job
      description: Canonical API resource for a human-verification handoff job.
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "200":
          description: Handoff job
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HandoffJob"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a human verification handoff job
      description: Closes its task-bound browser session and releases the reserved Browser Worker.
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "200":
          description: Handoff job deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          $ref: "#/components/responses/Error"
  /api/challenge-discovery/{id}/open-browser:
    post:
      summary: Open the task URL through the selected Browser Worker
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "200":
          description: Updated handoff job
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HandoffJob"
        "400":
          $ref: "#/components/responses/Error"
  /api/challenge-discovery/{id}/retry:
    post:
      summary: Retry a failed human verification handoff job
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "202":
          description: Handoff retry accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HandoffJob"
        "400":
          $ref: "#/components/responses/Error"
  /api/challenge-discovery/{id}/cancel:
    post:
      summary: Cancel a human verification handoff job
      description: Moves the job to cancelled and releases its Browser Worker lease. A late lease acquisition is released without reopening the job.
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "200":
          description: Handoff cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HandoffJob"
        "400":
          $ref: "#/components/responses/Error"
  /api/challenge-discovery/{id}/complete-human-verification:
    post:
      summary: Check whether human verification is complete
      description: Marks a verified handoff ready while retaining its Browser Worker session for the retry. Delete the handoff job when it is no longer needed.
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "202":
          description: Updated handoff job
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HandoffJob"
        "400":
          $ref: "#/components/responses/Error"
  /api/challenge-discovery/{id}/inspect-remote-page:
    post:
      summary: Inspect the matching page in the task-bound browser session
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "200":
          description: Updated handoff job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/challenge-discovery/{id}/create-selector-discovery-from-remote:
    post:
      summary: Create selector discovery from the task-bound browser page
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "202":
          description: Selector discovery queued from Browser Worker HTML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          $ref: "#/components/responses/Error"
  /.well-known/comiccrawler-browser-client:
    get:
      summary: Discover the outbound Browser Client command protocol
      security: []
      responses:
        "200":
          description: Browser Client protocol and endpoints
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BrowserClientDiscovery"
  /api/browser-clients/enroll:
    post:
      summary: Register one Browser Client installation
      security:
        - {}
        - userBearerAuth: []
          userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserClientEnrollmentRequest"
      responses:
        "201":
          description: Browser Client identity and one-time credential created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BrowserClientEnrollment"
        "401":
          $ref: "#/components/responses/Error"
  /api/browser-clients:
    get:
      summary: List visible registered Browser Clients
      responses:
        "200":
          description: Browser Client records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [clients]
                        properties:
                          clients:
                            type: array
                            items:
                              $ref: "#/components/schemas/BrowserClientRecord"
  /api/browser-workers:
    get:
      summary: List stable Browser Worker targets visible to the current user
      responses:
        "200":
          description: Worker identity, capabilities, and availability
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [workers]
                        properties:
                          workers:
                            type: array
                            items:
                              $ref: "#/components/schemas/BrowserWorker"
  /api/browser-clients/{clientId}:
    delete:
      summary: Revoke one Browser Client credential and disconnect its Workers
      parameters:
        - $ref: "#/components/parameters/BrowserClientId"
      responses:
        "204":
          description: Browser Client revoked
        "400":
          $ref: "#/components/responses/Error"
  /api/browser-clients/{clientId}/credentials/rotate:
    post:
      summary: Rotate one Browser Client credential
      parameters:
        - $ref: "#/components/parameters/BrowserClientId"
      responses:
        "200":
          description: Replacement credential issued once
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BrowserClientEnrollment"
        "400":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    userBearerAuth:
      type: http
      scheme: bearer
      description: User API token from the Server secret document.
    userIdHeader:
      type: apiKey
      in: header
      name: X-ComicCrawler-User-Id
  parameters:
    AdapterId:
      name: id
      in: path
      required: true
      schema:
        type: string
    FunctionId:
      name: functionId
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
    DiscoveryId:
      name: id
      in: path
      required: true
      schema:
        type: string
    HandoffId:
      name: id
      in: path
      required: true
      schema:
        type: string
    BrowserClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Message:
      description: Message response
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiResponse"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Message"
  schemas:
    ApiResponse:
      type: object
      required: [data]
      properties:
        data: {}
        error:
          type: string
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
        data: {}
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
    CrawlMode:
      type: string
      enum: [all, chapters]
    Capabilities:
      type: object
      properties:
        verification:
          type: boolean
        metadata:
          type: boolean
        chapterImages:
          type: boolean
    BrowserCapabilities:
      type: object
      required: [executionMode, navigation, renderedDom, humanHandoff, responsiveViewport]
      properties:
        executionMode:
          type: string
          enum: [existing-tab, managed-profile]
        navigation:
          type: boolean
        renderedDom:
          type: boolean
        humanHandoff:
          type: boolean
        responsiveViewport:
          type: boolean
    BrowserClientDiscovery:
      type: object
      required: [protocolVersion, apiSecurityMode, endpoints]
      properties:
        protocolVersion:
          type: integer
          const: 2
        apiSecurityMode:
          type: string
          enum: [public, token]
        endpoints:
          type: object
          required: [enroll, controlWebSocket]
          properties:
            enroll:
              type: string
              example: /api/browser-clients/enroll
            controlWebSocket:
              type: string
              example: /api/browser-clients/connect
    BrowserClientEnrollmentRequest:
      type: object
      required: [capabilities]
      properties:
        name:
          type: string
        capabilities:
          $ref: "#/components/schemas/BrowserCapabilities"
    BrowserClientEnrollment:
      type: object
      required: [clientId, credentialId, credential, registeredAt]
      properties:
        clientId:
          type: string
        credentialId:
          type: string
        credential:
          type: string
          writeOnly: true
        registeredAt:
          type: string
          format: date-time
    BrowserClientRecord:
      type: object
      required: [clientId, ownerUserId, name, credentialId, registeredCapabilities, registeredAt]
      properties:
        clientId:
          type: string
        ownerUserId:
          type: string
        name:
          type: string
        credentialId:
          type: string
        registeredAt:
          type: string
          format: date-time
        lastConnectedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        registeredCapabilities:
          $ref: "#/components/schemas/BrowserCapabilities"
    BrowserTarget:
      oneOf:
        - type: object
          required: [mode]
          properties:
            mode:
              const: managed-profile
            workerId:
              type: string
        - type: object
          required: [mode, workerId, resourceId]
          properties:
            mode:
              const: existing-tab
            workerId:
              type: string
            resourceId:
              type: string
    ExistingTabBrowserTarget:
      type: object
      additionalProperties: false
      required: [mode, workerId, resourceId]
      properties:
        mode:
          const: existing-tab
        workerId:
          type: string
        resourceId:
          type: string
    RebindBrowserTargetRequest:
      type: object
      additionalProperties: false
      required: [expectedBrowserTarget, browserTarget]
      properties:
        expectedBrowserTarget:
          $ref: "#/components/schemas/ExistingTabBrowserTarget"
        browserTarget:
          $ref: "#/components/schemas/ExistingTabBrowserTarget"
    TaskBrowserTargetReboundEvent:
      type: object
      required: [type, occurredAt, previousBrowserTarget, browserTarget, previousStatus, recovery]
      properties:
        type:
          const: task:browser_target_rebound
        occurredAt:
          type: string
          format: date-time
        previousBrowserTarget:
          $ref: "#/components/schemas/ExistingTabBrowserTarget"
        browserTarget:
          $ref: "#/components/schemas/ExistingTabBrowserTarget"
        previousStatus:
          type: string
        previousTaskError:
          type: string
        previousResultError:
          type: string
        recovery:
          type: object
          required: [reason, reboundAt]
          properties:
            reason:
              const: browser_client_process_restarted
            reboundAt:
              type: string
              format: date-time
    RebindBrowserTargetResponse:
      type: object
      required: [task, previousBrowserTarget, recovery]
      properties:
        task:
          type: object
          required: [id, status, browserTarget]
          properties:
            id:
              type: string
            status:
              type: string
            browserTarget:
              $ref: "#/components/schemas/ExistingTabBrowserTarget"
        previousBrowserTarget:
          $ref: "#/components/schemas/ExistingTabBrowserTarget"
        recovery:
          type: object
          required: [reason, reboundAt, idempotent]
          properties:
            reason:
              const: browser_client_process_restarted
            reboundAt:
              type: string
              format: date-time
            idempotent:
              type: boolean
        challenge:
          $ref: "#/components/schemas/HandoffJob"
    BrowserWorker:
      type: object
      required: [workerId, clientId, name, ownerUserId, processInstanceId, status, online, capabilities, connectedAt, lastHeartbeatAt]
      properties:
        workerId:
          type: string
        clientId:
          type: string
        name:
          type: string
        ownerUserId:
          type: string
        processInstanceId:
          type: string
        status:
          type: string
          enum: [offline, idle, busy]
        online:
          type: boolean
        capabilities:
          $ref: "#/components/schemas/BrowserCapabilities"
        activeSessionId:
          type: string
        connectedAt:
          type: string
          format: date-time
        lastHeartbeatAt:
          type: string
          format: date-time
    Adapter:
      type: object
      required: [id, name, domains, parseMode, capabilities]
      properties:
        id:
          type: string
        name:
          type: string
        domains:
          type: array
          items:
            type: string
        parseMode:
          type: string
          const: playwright
        capabilities:
          $ref: "#/components/schemas/Capabilities"
    AdapterListItem:
      type: object
      required: [id, name, domains, parseMode, capabilities, activeVersionLabel, versionCount]
      properties:
        id:
          type: string
        name:
          type: string
        domains:
          type: array
          items:
            type: string
        parseMode:
          type: string
          const: playwright
        capabilities:
          $ref: "#/components/schemas/Capabilities"
        activeVersionLabel:
          type: string
        versionCount:
          type: integer
        implementationKind:
          type: string
          enum: [project-source, ts-implementation, summary, generated-draft]
        sourcePath:
          type: string
        sourceWillBeDeleted:
          type: boolean
        sourceDiscoveryId:
          type: string
        promotedAt:
          type: string
          format: date-time
    AdapterResolveRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        mode:
          $ref: "#/components/schemas/CrawlMode"
    AdapterResolveResponse:
      type: object
      required: [url, hostname, mode, requiredCapabilities, status, discoveryTarget]
      properties:
        url:
          type: string
          format: uri
        hostname:
          type: string
        mode:
          $ref: "#/components/schemas/CrawlMode"
        requiredCapabilities:
          type: object
        status:
          type: string
          enum: [matched, capability_mismatch, not_found]
        adapter:
          $ref: "#/components/schemas/Adapter"
        matchedAdapter:
          $ref: "#/components/schemas/Adapter"
        discoveryTarget:
          type: string
          enum: [full, chapter-only]
    ChapterImagesRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        adapterId:
          type: string
        challengeDiscoveryId:
          type: string
        browserTarget:
          $ref: "#/components/schemas/BrowserTarget"
        renderContext:
          $ref: "#/components/schemas/RenderContext"
    RenderContext:
      type: object
      required: [viewport]
      description: Rendering dimensions for an isolated Playwright browser context. Viewport dimensions use CSS pixels.
      properties:
        viewport:
          type: object
          required: [width, height]
          properties:
            width:
              type: integer
              minimum: 1
              maximum: 10000
            height:
              type: integer
              minimum: 1
              maximum: 10000
        deviceScaleFactor:
          type: number
          minimum: 0.1
          maximum: 10
          default: 1
    EffectiveRenderContext:
      allOf:
        - $ref: "#/components/schemas/RenderContext"
        - type: object
          required: [deviceScaleFactor]
    ChapterIdentityDescriptor:
      type: object
      required: [id, canonicalUrl, stability, identitySource]
      properties:
        id:
          type: string
          description: Opaque adapter-scoped deterministic chapter identity. Clients must not parse it.
        canonicalUrl:
          type: string
          format: uri
        stability:
          type: string
          enum: [deterministic]
          description: The same adapter identity rules and logical chapter produce the same ID across Server restarts.
        identitySource:
          type: string
          enum: [adapter, normalized-url]
          description: Whether the adapter supplied identity rules or ComicCrawler used normalized URL identity.
    ChapterImageDescriptor:
      type: object
      required: [id, orderIndex, url]
      properties:
        id:
          type: string
          description: Opaque deterministic identity scoped to the returned chapter. Clients must not parse it.
        orderIndex:
          type: integer
          minimum: 0
          description: Current zero-based position. Reordering changes this value without changing the ID when the source key remains stable.
        url:
          type: string
          format: uri
          description: Current retrievable image URL.
        sourceFingerprint:
          type: string
          description: "Optional adapter-supplied revision token. Prefixes such as sha256:, etag:, or opaque: identify its semantics."
    ChapterImagesResponse:
      type: object
      required: [adapterId, chapterUrl, chapter, imageUrlCount, imageUrls, images, domSource, durationMs, renderContext]
      properties:
        adapterId:
          type: string
        chapterUrl:
          type: string
          format: uri
        chapter:
          $ref: "#/components/schemas/ChapterIdentityDescriptor"
        imageUrlCount:
          type: integer
          minimum: 1
          description: Number of entries in imageUrls. Always equals imageUrls.length.
        imageUrls:
          type: array
          minItems: 1
          description: Complete ordered image URL list. This array is never truncated to a preview subset.
          items:
            type: string
            format: uri
        images:
          type: array
          minItems: 1
          description: Complete ordered page descriptors. URLs and ordering exactly mirror imageUrls.
          items:
            $ref: "#/components/schemas/ChapterImageDescriptor"
        domSource:
          type: string
          enum: [static, rendered, verified-fixture, handoff-required]
        durationMs:
          type: integer
          minimum: 0
        renderContext:
          $ref: "#/components/schemas/EffectiveRenderContext"
    AdapterFunctionTestRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        challengeDiscoveryId:
          type: string
        browserTarget:
          $ref: "#/components/schemas/BrowserTarget"
    AdapterFunctionTiming:
      type: object
      required: [step, durationMs]
      properties:
        step:
          type: string
        durationMs:
          type: number
    AdapterFunctionTestResponse:
      type: object
      required: [ok, status, adapterId, functionId, durationMs, domSource, readiness, recommendedAction, requiresVerification]
      properties:
        ok:
          type: boolean
        status:
          type: string
          enum: [passed, failed, verification_required]
        adapterId:
          type: string
        functionId:
          type: string
        durationMs:
          type: number
        timings:
          type: array
          items:
            $ref: "#/components/schemas/AdapterFunctionTiming"
        domSource:
          type: string
          enum: [static, rendered, verified-fixture, handoff-required]
        readiness:
          type: object
        recommendedAction:
          type: string
        resultSummary:
          type: object
          description: For extractChapterImageUrls, includes imageUrlCount and the full imageUrls array.
        error:
          type: string
        errorCode:
          type: string
          enum: [CHAPTER_IMAGES_VERIFICATION_REQUIRED, ADAPTER_FUNCTION_VERIFICATION_REQUIRED]
        requiresVerification:
          type: boolean
        challengeDiscoveryId:
          type: string
        challengeStatus:
          $ref: "#/components/schemas/ChallengeDiscoveryStatus"
        challenge:
          $ref: "#/components/schemas/VerificationChallengeSummary"
        retryableAfterVerification:
          type: boolean
        verificationMessage:
          type: string
    ChallengeDiscoveryStatus:
      type: string
      enum:
        - queued
        - ready
        - challenge_detected
        - challenge_required
        - challenge_auto_attempt_failed
        - browser_open
        - access_blocked
        - strategy_awaiting_review
        - strategy_promoted
        - failed
        - cancelled
    VerificationChallengeSummary:
      type: object
      required: [id, status, normalizedUrl, retryableAfterVerification]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/ChallengeDiscoveryStatus"
        normalizedUrl:
          type: string
          format: uri
        retryableAfterVerification:
          type: boolean
        ownerUserId:
          type: string
        browserTarget:
          $ref: "#/components/schemas/BrowserTarget"
    ChapterImagesVerificationRequiredError:
      type: object
      required: [error, code, data]
      properties:
        error:
          type: string
        code:
          const: CHAPTER_IMAGES_VERIFICATION_REQUIRED
        data:
          $ref: "#/components/schemas/AdapterFunctionTestResponse"
    CreateTaskRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        adapterId:
          type: string
        mode:
          $ref: "#/components/schemas/CrawlMode"
        chapters:
          type: array
          items:
            type: string
        chapterUrls:
          type: array
          items:
            type: string
            format: uri
        priority:
          type: number
        browserTarget:
          $ref: "#/components/schemas/BrowserTarget"
    CreateTaskResponse:
      oneOf:
        - type: object
          required: [kind, taskId, browserTarget]
          properties:
            kind:
              const: taskCreated
            taskId:
              type: string
            browserTarget:
              $ref: "#/components/schemas/BrowserTarget"
        - type: object
          required: [kind, reason, discoveryId, status, normalizedUrl]
          properties:
            kind:
              const: discoveryQueued
            reason:
              enum: [adapter_not_found, adapter_capability_mismatch]
            discoveryId:
              type: string
            status:
              type: string
            normalizedUrl:
              type: string
            target:
              enum: [full, chapter-only]
        - type: object
          required: [kind, reason, challengeDiscoveryId, status, normalizedUrl]
          properties:
            kind:
              const: challengeDiscoveryQueued
            reason:
              const: browser_challenge
            challengeDiscoveryId:
              type: string
            status:
              type: string
            normalizedUrl:
              type: string
    TaskListResponse:
      type: object
      required: [tasks, stats]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskSummary"
        stats:
          type: object
    TaskSummary:
      type: object
      required: [id, url, status, priority, createdAt]
      properties:
        id:
          type: string
        url:
          type: string
        status:
          type: string
        priority:
          type: number
        createdAt:
          type: string
        error:
          type: string
        browserTarget:
          $ref: "#/components/schemas/BrowserTarget"
    TaskDetailResponse:
      type: object
      required: [task, checkpoint, preview, events]
      properties:
        task:
          $ref: "#/components/schemas/TaskSummary"
        progress:
          type:
            - object
            - "null"
        result:
          type: object
        checkpoint:
          type:
            - object
            - "null"
        preview:
          type:
            - object
            - "null"
        events:
          type: array
          items:
            $ref: "#/components/schemas/TaskBrowserTargetReboundEvent"
    SelectorDiscoveryJob:
      type: object
      required: [id, url, normalizedUrl, hostname, status]
      properties:
        id:
          type: string
        url:
          type: string
        normalizedUrl:
          type: string
        hostname:
          type: string
        status:
          type: string
        target:
          enum: [full, chapter-only]
        promotionMode:
          enum: [create, augment]
        baseAdapterId:
          type: string
        adapterId:
          type: string
        adapterName:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        adapterImplementationTs:
          type: string
        ownerUserId:
          type: string
        browserTarget:
          $ref: "#/components/schemas/BrowserTarget"
        reviewNotesMarkdown:
          type: string
          description: Human review notes generated with the implementation draft.
        implementationValidation:
          type: object
          description: Static validation result for the TypeScript implementation draft.
        error:
          type: string
    FixtureSummary:
      type: object
      required: [id, domain, url, title, htmlLength, capturedAt, path, readiness]
      properties:
        id:
          type: string
        domain:
          type: string
        url:
          type: string
          format: uri
        title:
          type: string
        htmlLength:
          type: integer
        capturedAt:
          type: string
          format: date-time
        path:
          type: string
        expectedPath:
          type: string
        adapterId:
          type: string
        sourceDiscoveryId:
          type: string
        functionIds:
          type: array
          items:
            type: string
        readiness:
          type: object
    AdapterPackageManifest:
      type: object
      required: [schemaVersion, adapterId, version, name, domains, urlPatterns, parseMode, capabilities, origin, createdAt]
      properties:
        schemaVersion:
          type: integer
          const: 1
        adapterId:
          type: string
        version:
          type: string
        name:
          type: string
        domains:
          type: array
          items:
            type: string
        urlPatterns:
          type: array
          items:
            type: string
        parseMode:
          type: string
          const: playwright
        capabilities:
          $ref: "#/components/schemas/Capabilities"
        origin:
          type: string
          enum: [bundled, local-generated, imported, official]
        createdAt:
          type: string
          format: date-time
        sourceDiscoveryId:
          type: string
        approvalFixture:
          $ref: "#/components/schemas/AdapterPackageFixtureSummary"
    AdapterPackageFixtureSummary:
      type: object
      required: [id, domain, url, title, htmlLength, capturedAt, readiness]
      description: Portable fixture provenance without local filesystem paths or fixture contents.
      properties:
        id:
          type: string
        domain:
          type: string
        url:
          type: string
          format: uri
        title:
          type: string
        htmlLength:
          type: integer
        capturedAt:
          type: string
          format: date-time
        adapterId:
          type: string
        sourceDiscoveryId:
          type: string
        functionIds:
          type: array
          items:
            type: string
        readiness:
          type: object
    AdapterPackageDocument:
      type: object
      required: [manifest, implementationTs, validation, checksums]
      properties:
        manifest:
          $ref: "#/components/schemas/AdapterPackageManifest"
        implementationTs:
          type: string
        validation:
          type: object
          required: [valid, syntaxValid, errors, warnings]
          properties:
            valid:
              type: boolean
            syntaxValid:
              type: boolean
            errors:
              type: array
              items:
                type: string
            warnings:
              type: array
              items:
                type: string
        checksums:
          type: object
          required: [algorithm, manifest, implementation]
          properties:
            algorithm:
              type: string
              const: sha256
            manifest:
              type: string
              pattern: "^[a-f0-9]{64}$"
            implementation:
              type: string
              pattern: "^[a-f0-9]{64}$"
    AdapterPackageImportResponse:
      type: object
      required: [entry, inspection, activated]
      properties:
        entry:
          $ref: "#/components/schemas/AdapterCatalogEntry"
        inspection:
          type: object
          required: [adapterId, version, name, domains, capabilities, origin, sourceValid, warnings]
          properties:
            adapterId:
              type: string
            version:
              type: string
            name:
              type: string
            domains:
              type: array
              items:
                type: string
            capabilities:
              $ref: "#/components/schemas/Capabilities"
            origin:
              type: string
              enum: [bundled, local-generated, imported, official]
            sourceValid:
              type: boolean
            warnings:
              type: array
              items:
                type: string
        activated:
          type: boolean
    AdapterRegistryPackageRecord:
      type: object
      required: [adapterId, version, packageUrl, publishedAt, manifestChecksum, implementationChecksum, keyId]
      properties:
        adapterId:
          type: string
        version:
          type: string
        packageUrl:
          type: string
          format: uri
        publishedAt:
          type: string
          format: date-time
        manifestChecksum:
          type: string
          pattern: "^[a-f0-9]{64}$"
        implementationChecksum:
          type: string
          pattern: "^[a-f0-9]{64}$"
        keyId:
          type: string
    AdapterRegistryUpdate:
      type: object
      required: [registryId, package, installed, active]
      properties:
        registryId:
          type: string
        package:
          $ref: "#/components/schemas/AdapterRegistryPackageRecord"
        installed:
          type: boolean
        active:
          type: boolean
    AdapterRegistryInstallRequest:
      type: object
      required: [adapterId]
      properties:
        registryId:
          type: string
        adapterId:
          type: string
        version:
          type: string
        activate:
          type: boolean
          default: false
    AdapterRegistryUpdateResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AdapterRegistryUpdate"
    AdapterRegistryUpdateListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/AdapterRegistryUpdate"
    AdapterCatalogEntry:
      type: object
      required: [adapterId, activeVersion, versions]
      properties:
        adapterId:
          type: string
        activeVersion:
          type: [string, "null"]
        lastActiveVersion:
          type: string
        deletedAt:
          type: string
          format: date-time
        versions:
          type: array
          items:
            type: object
            required: [version, status, origin, createdAt, installedAt]
            properties:
              version:
                type: string
              status:
                type: string
                enum: [approved, active]
              origin:
                type: string
                enum: [bundled, local-generated, imported, official]
              createdAt:
                type: string
                format: date-time
              installedAt:
                type: string
                format: date-time
              sourceDiscoveryId:
                type: string
    HandoffJob:
      type: object
      required: [id, url, normalizedUrl, hostname, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        url:
          type: string
        normalizedUrl:
          type: string
        hostname:
          type: string
        status:
          $ref: "#/components/schemas/ChallengeDiscoveryStatus"
        ownerUserId:
          type: string
        browserTarget:
          $ref: "#/components/schemas/BrowserTarget"
        browserSessionId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        error:
          type: string
