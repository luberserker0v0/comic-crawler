openapi: 3.1.0
info:
  title: ComicCrawler REST API
  version: 0.1.0
  description: REST contract for ComicCrawler clients. Access may be public or protected by the configured API security policy.
servers:
  - url: http://127.0.0.1:4100
security:
  - {}
  - userBearerAuth: []
    userIdHeader: []
paths:
  /api/status:
    get:
      summary: Health and runtime status
      security: []
      responses:
        "200":
          description: Server status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/adapters:
    get:
      summary: List registered adapters
      responses:
        "200":
          description: Adapter list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AdapterListItem"
  /api/adapters/resolve:
    post:
      summary: Resolve which adapter can handle a URL and mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdapterResolveRequest"
      responses:
        "200":
          description: Adapter resolution result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdapterResolveResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/adapters/chapter-images:
    post:
      summary: Extract every image URL from one chapter
      description: Resolves a compatible adapter unless adapterId is supplied, then returns the complete ordered image URL list without creating a download task. imageUrlCount always equals imageUrls.length; imageUrls is never truncated to a preview subset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterImagesRequest"
      responses:
        "200":
          description: Complete chapter image URL result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChapterImagesResponse"
              example:
                data:
                  adapterId: site-adapter
                  chapterUrl: https://comic.example/manga/example/chapter-10
                  imageUrlCount: 2
                  imageUrls:
                    - https://cdn.example/001.jpg
                    - https://cdn.example/002.jpg
                  domSource: static
                  durationMs: 42
                  renderContext:
                    viewport:
                      width: 390
                      height: 844
                    deviceScaleFactor: 3
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/adapters/deleted:
    get:
      summary: List deleted adapters
      responses:
        "200":
          description: Deleted adapters and restore availability
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          adapters:
                            type: array
                            items:
                              type: object
                              required: [adapterId, deletedAt, restorable, restoreReason]
                              properties:
                                adapterId:
                                  type: string
                                deletedAt:
                                  type: string
                                implementationKind:
                                  type: string
                                sourcePath:
                                  type: string
                                sourceDirectory:
                                  type: string
                                sourceDeleted:
                                  type: boolean
                                sourceExists:
                                  type: boolean
                                restorable:
                                  type: boolean
                                restoreReason:
                                  type: string
  /api/adapters/{id}:
    get:
      summary: Read adapter detail
      parameters:
        - $ref: "#/components/parameters/AdapterId"
      responses:
        "200":
          description: Adapter detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdapterListItem"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a registered adapter
      description: Removes generated adapter runtime records with a deleted-record backup. For project TypeScript adapters, deletes the adapter source directory as a project code change.
      parameters:
        - $ref: "#/components/parameters/AdapterId"
      responses:
        "200":
          description: Adapter deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [adapterId, message, registryRemoved, deletedMarkerWritten, sourceDeleted, runtimeRecordsRemoved]
                        properties:
                          adapterId:
                            type: string
                          message:
                            type: string
                          implementationKind:
                            type: string
                          registryRemoved:
                            type: boolean
                          deletedMarkerWritten:
                            type: boolean
                          sourcePath:
                            type: string
                          sourceDirectory:
                            type: string
                          sourceDeleted:
                            type: boolean
                          runtimeRecordsRemoved:
                            type: object
                            properties:
                              selectorManifest:
                                type: boolean
                              tsImplementation:
                                type: boolean
        "404":
          $ref: "#/components/responses/Error"
  /api/adapters/{id}/restore:
    post:
      summary: Restore a deleted adapter
      description: Restores generated adapters from the deleted-record backup or project-source adapters only after their source exists again.
      parameters:
        - $ref: "#/components/parameters/AdapterId"
      responses:
        "200":
          description: Adapter restored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [adapterId, message, restored]
                        properties:
                          adapterId:
                            type: string
                          message:
                            type: string
                          implementationKind:
                            type: string
                          restored:
                            type: boolean
                          sourcePath:
                            type: string
                          sourceDirectory:
                            type: string
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/adapters/{id}/capabilities:
    get:
      summary: Read Adapter Lab capabilities and function descriptors
      parameters:
        - $ref: "#/components/parameters/AdapterId"
      responses:
        "200":
          description: Adapter capability detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          $ref: "#/components/responses/Error"
  /api/adapters/{id}/implementation:
    get:
      summary: Read full Adapter Lab implementation source or manifest
      parameters:
        - $ref: "#/components/parameters/AdapterId"
      responses:
        "200":
          description: Adapter implementation artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          $ref: "#/components/responses/Error"
  /api/adapters/{id}/functions/{functionId}/test:
    post:
      summary: Run an Adapter Lab function test
      description: Metadata functions expect manga catalog URLs. Chapter image functions expect chapter URLs.
      parameters:
        - $ref: "#/components/parameters/AdapterId"
        - $ref: "#/components/parameters/FunctionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdapterFunctionTestRequest"
      responses:
        "200":
          description: Function test result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdapterFunctionTestResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/tasks:
    get:
      summary: List tasks
      responses:
        "200":
          description: Task list and stats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TaskListResponse"
    post:
      summary: Create a crawl task or queue adapter/verification preparation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CreateTaskResponse"
        "202":
          description: Selector discovery or verification handoff queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CreateTaskResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/tasks/{id}:
    get:
      summary: Read task detail, checkpoint, result, and preview metadata
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TaskDetailResponse"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a terminal or waiting-verification task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "400":
          $ref: "#/components/responses/Error"
  /api/tasks/{id}/resume:
    post:
      summary: Resume a paused, interrupted, failed, or waiting-verification task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "409":
          description: Human verification handoff is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          $ref: "#/components/responses/Error"
  /api/tasks/{id}/preview-file:
    get:
      summary: Read a downloaded image preview file
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image file stream
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /api/selector-discovery/{id}:
    get:
      summary: Read selector discovery job
      parameters:
        - $ref: "#/components/parameters/DiscoveryId"
      responses:
        "200":
          description: Selector discovery job
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SelectorDiscoveryJob"
        "404":
          $ref: "#/components/responses/Error"
  /api/selector-discovery/{id}/promote:
    post:
      summary: Capture a golden fixture and promote a reviewed TypeScript adapter draft
      description: Fetches the reviewed rendered page through the active Browser Provider, stores page.html and expected.json, and registers the adapter only after fixture capture succeeds.
      parameters:
        - $ref: "#/components/parameters/DiscoveryId"
      responses:
        "200":
          description: Promoted TypeScript adapter implementation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ActiveImplementationAdapterRecord"
        "400":
          $ref: "#/components/responses/Error"
  /api/fixtures/{domain}/{id}/verify-approved-adapter:
    post:
      summary: Replay an approved adapter fixture
      description: Runs every function recorded in expected.json against page.html and compares the complete normalized result.
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adapterId]
              properties:
                adapterId:
                  type: string
      responses:
        "200":
          description: Fixture replay result; passed is false when output differs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [fixture, passed, expected, actual]
                        properties:
                          fixture:
                            $ref: "#/components/schemas/FixtureSummary"
                          passed:
                            type: boolean
                          expected:
                            type: object
                            additionalProperties: true
                          actual:
                            type: object
                            additionalProperties: true
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/challenge-discovery/{id}:
    get:
      summary: Read a human verification handoff job
      description: Canonical API resource for a human-verification handoff job.
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "200":
          description: Handoff job
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HandoffJob"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a human verification handoff job
      description: Closes its remote browser context and releases the reserved Browser Worker.
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "200":
          description: Handoff job deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          $ref: "#/components/responses/Error"
  /api/challenge-discovery/{id}/open-browser:
    post:
      summary: Open the task URL in the configured remote Playwright browser
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "200":
          description: Updated handoff job
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HandoffJob"
        "400":
          $ref: "#/components/responses/Error"
  /api/challenge-discovery/{id}/complete-human-verification:
    post:
      summary: Check whether human verification is complete
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "202":
          description: Updated handoff job
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HandoffJob"
        "400":
          $ref: "#/components/responses/Error"
  /api/challenge-discovery/{id}/inspect-remote-page:
    post:
      summary: Inspect the matching page in the remote Playwright browser
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "200":
          description: Updated handoff job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/challenge-discovery/{id}/create-selector-discovery-from-remote:
    post:
      summary: Create selector discovery from the matching remote browser page
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "202":
          description: Selector discovery queued from remote browser HTML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          $ref: "#/components/responses/Error"
  /.well-known/comiccrawler-browser-provider:
    get:
      summary: Discover the outbound Browser Provider service contract
      security: []
      responses:
        "200":
          description: Browser Provider service endpoints
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BrowserProviderServiceDiscovery"
  /api/browser-providers/enroll:
    post:
      summary: Register one Browser Provider instance
      security:
        - {}
        - userBearerAuth: []
          userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserProviderRegistrationRequest"
      responses:
        "201":
          description: Provider identity and credential created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BrowserProviderRegistration"
        "401":
          $ref: "#/components/responses/Error"
  /api/browser-providers:
    get:
      summary: List visible registered Browser Providers
      responses:
        "200":
          description: Provider records and online state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BrowserProviderRegistryState"
  /api/browser-workers:
    get:
      summary: List stable Browser Worker targets visible to the current user
      responses:
        "200":
          description: Worker identity, capabilities, and availability
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [workers]
                        properties:
                          workers:
                            type: array
                            items:
                              $ref: "#/components/schemas/BrowserWorker"
  /api/browser-providers/{providerId}:
    delete:
      summary: Revoke one Browser Provider credential and close its resources
      parameters:
        - $ref: "#/components/parameters/BrowserProviderId"
      responses:
        "204":
          description: Browser provider revoked
        "400":
          $ref: "#/components/responses/Error"
  /api/browser-providers/{providerId}/credentials/rotate:
    post:
      summary: Rotate one Browser Provider credential
      parameters:
        - $ref: "#/components/parameters/BrowserProviderId"
      responses:
        "200":
          description: Replacement credential issued once
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BrowserProviderRegistration"
        "400":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    userBearerAuth:
      type: http
      scheme: bearer
      description: User API token from the Server secret document.
    userIdHeader:
      type: apiKey
      in: header
      name: X-ComicCrawler-User-Id
  parameters:
    AdapterId:
      name: id
      in: path
      required: true
      schema:
        type: string
    FunctionId:
      name: functionId
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
    DiscoveryId:
      name: id
      in: path
      required: true
      schema:
        type: string
    HandoffId:
      name: id
      in: path
      required: true
      schema:
        type: string
    BrowserProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Message:
      description: Message response
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiResponse"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Message"
  schemas:
    ApiResponse:
      type: object
      required: [data]
      properties:
        data: {}
        error:
          type: string
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        data: {}
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
    CrawlMode:
      type: string
      enum: [all, chapters]
    Capabilities:
      type: object
      properties:
        verification:
          type: boolean
        metadata:
          type: boolean
        chapterImages:
          type: boolean
    BrowserProviderCapabilities:
      type: object
      required: [browser, headed, interactive, persistentContext, screenshots, downloads, tracing]
      properties:
        browser:
          type: string
          enum: [chromium, firefox, webkit]
        headed:
          type: boolean
        interactive:
          type: boolean
        persistentContext:
          type: boolean
        screenshots:
          type: boolean
        downloads:
          type: boolean
        tracing:
          type: boolean
    BrowserProviderDescriptor:
      type: object
      required: [contractVersion, providerId, processInstanceId, providerType, runtimeVersion, capabilities, transports]
      properties:
        contractVersion:
          type: string
          const: "2"
        providerId:
          type: string
        processInstanceId:
          type: string
          description: Changes on every Browser Worker process start and protects reconnect resumption.
        providerType:
          type: string
          enum: [playwright, cdp]
        runtimeVersion:
          type: string
        capabilities:
          $ref: "#/components/schemas/BrowserProviderCapabilities"
        transports:
          type: array
          items:
            type: string
            enum: [reverse-relay]
    BrowserProviderServiceDiscovery:
      type: object
      required: [contractVersion, transport, apiSecurityMode, endpoints]
      properties:
        contractVersion:
          type: string
          const: "2"
        transport:
          type: string
          const: reverse-relay
        apiSecurityMode:
          type: string
          enum: [public, token]
        endpoints:
          type: object
          required: [enroll, controlWebSocket, relayWebSocketTemplate]
          properties:
            enroll:
              type: string
              example: /api/browser-providers/enroll
            controlWebSocket:
              type: string
              example: /api/browser-providers/connect
            relayWebSocketTemplate:
              type: string
              example: /api/browser-providers/relay/{tunnelId}
    BrowserProviderRegistrationRequest:
      type: object
      required: [clientInstanceId]
      properties:
        clientInstanceId:
          type: string
          description: Stable UUID or equivalent logical installation identifier. It is not a hardware fingerprint.
        providerName:
          type: string
          description: Optional user-facing display name.
    BrowserProviderRegistration:
      type: object
      required: [providerId, clientInstanceId, credentialId, credential, registeredAt]
      properties:
        providerId:
          type: string
        clientInstanceId:
          type: string
        credentialId:
          type: string
        credential:
          type: string
          writeOnly: true
        registeredAt:
          type: string
          format: date-time
    BrowserProviderRecord:
      type: object
      required: [providerId, ownerUserId, clientInstanceId, providerName, credentialId, registeredAt, online]
      properties:
        providerId:
          type: string
        ownerUserId:
          type: string
        clientInstanceId:
          type: string
        providerName:
          type: string
        credentialId:
          type: string
        registeredAt:
          type: string
          format: date-time
        lastConnectedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        connectionId:
          type: string
        online:
          type: boolean
        descriptor:
          $ref: "#/components/schemas/BrowserProviderDescriptor"
    BrowserProviderRegistryState:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/BrowserProviderRecord"
    BrowserTarget:
      oneOf:
        - type: object
          required: [mode]
          properties:
            mode:
              const: any
        - type: object
          required: [mode, workerId]
          properties:
            mode:
              const: specific
            workerId:
              type: string
    BrowserWorker:
      type: object
      required: [workerId, name, status, online]
      properties:
        workerId:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [offline, idle, busy]
        online:
          type: boolean
        capabilities:
          $ref: "#/components/schemas/BrowserProviderCapabilities"
        activeTaskId:
          type: string
        lastConnectedAt:
          type: string
          format: date-time
    Adapter:
      type: object
      required: [id, name, domains, parseMode, capabilities]
      properties:
        id:
          type: string
        name:
          type: string
        domains:
          type: array
          items:
            type: string
