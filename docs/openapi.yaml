openapi: 3.1.0
info:
  title: ComicCrawler REST API
  version: 0.1.0
  description: Public REST contract for API-only crawl clients.
servers:
  - url: http://127.0.0.1:4100
paths:
  /api/status:
    get:
      summary: Health and runtime status
      responses:
        "200":
          description: Server status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /api/adapters:
    get:
      summary: List registered adapters
      responses:
        "200":
          description: Adapter list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AdapterListItem"
  /api/adapters/resolve:
    post:
      summary: Resolve which adapter can handle a URL and mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdapterResolveRequest"
      responses:
        "200":
          description: Adapter resolution result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdapterResolveResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/adapters/chapter-images:
    post:
      summary: Extract every image URL from one chapter
      description: Resolves a compatible adapter unless adapterId is supplied, then returns the complete ordered image URL list without creating a download task. imageUrlCount always equals imageUrls.length; imageUrls is never truncated to a preview subset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterImagesRequest"
      responses:
        "200":
          description: Complete chapter image URL result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChapterImagesResponse"
              example:
                data:
                  adapterId: site-adapter
                  chapterUrl: https://comic.example/manga/example/chapter-10
                  imageUrlCount: 2
                  imageUrls:
                    - https://cdn.example/001.jpg
                    - https://cdn.example/002.jpg
                  domSource: static
                  durationMs: 42
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/adapters/deleted:
    get:
      summary: List deleted adapters
      responses:
        "200":
          description: Deleted adapters and restore availability
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          adapters:
                            type: array
                            items:
                              type: object
                              required: [adapterId, deletedAt, restorable, restoreReason]
                              properties:
                                adapterId:
                                  type: string
                                deletedAt:
                                  type: string
                                implementationKind:
                                  type: string
                                sourcePath:
                                  type: string
                                sourceDirectory:
                                  type: string
                                sourceDeleted:
                                  type: boolean
                                sourceExists:
                                  type: boolean
                                restorable:
                                  type: boolean
                                restoreReason:
                                  type: string
  /api/adapters/{id}:
    get:
      summary: Read adapter detail
      parameters:
        - $ref: "#/components/parameters/AdapterId"
      responses:
        "200":
          description: Adapter detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdapterListItem"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a registered adapter
      description: Removes generated adapter runtime records with a deleted-record backup. For project TypeScript adapters, deletes the adapter source directory as a project code change.
      parameters:
        - $ref: "#/components/parameters/AdapterId"
      responses:
        "200":
          description: Adapter deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [adapterId, message, registryRemoved, deletedMarkerWritten, sourceDeleted, runtimeRecordsRemoved]
                        properties:
                          adapterId:
                            type: string
                          message:
                            type: string
                          implementationKind:
                            type: string
                          registryRemoved:
                            type: boolean
                          deletedMarkerWritten:
                            type: boolean
                          sourcePath:
                            type: string
                          sourceDirectory:
                            type: string
                          sourceDeleted:
                            type: boolean
                          runtimeRecordsRemoved:
                            type: object
                            properties:
                              selectorManifest:
                                type: boolean
                              tsImplementation:
                                type: boolean
        "404":
          $ref: "#/components/responses/Error"
  /api/adapters/{id}/restore:
    post:
      summary: Restore a deleted adapter
      description: Restores generated adapters from the deleted-record backup or project-source adapters only after their source exists again.
      parameters:
        - $ref: "#/components/parameters/AdapterId"
      responses:
        "200":
          description: Adapter restored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [adapterId, message, restored]
                        properties:
                          adapterId:
                            type: string
                          message:
                            type: string
                          implementationKind:
                            type: string
                          restored:
                            type: boolean
                          sourcePath:
                            type: string
                          sourceDirectory:
                            type: string
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/adapters/{id}/capabilities:
    get:
      summary: Read Adapter Lab capabilities and function descriptors
      parameters:
        - $ref: "#/components/parameters/AdapterId"
      responses:
        "200":
          description: Adapter capability detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          $ref: "#/components/responses/Error"
  /api/adapters/{id}/implementation:
    get:
      summary: Read full Adapter Lab implementation source or manifest
      parameters:
        - $ref: "#/components/parameters/AdapterId"
      responses:
        "200":
          description: Adapter implementation artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          $ref: "#/components/responses/Error"
  /api/adapters/{id}/functions/{functionId}/test:
    post:
      summary: Run an Adapter Lab function test
      description: Metadata functions expect manga catalog URLs. Chapter image functions expect chapter URLs.
      parameters:
        - $ref: "#/components/parameters/AdapterId"
        - $ref: "#/components/parameters/FunctionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdapterFunctionTestRequest"
      responses:
        "200":
          description: Function test result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdapterFunctionTestResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/tasks:
    get:
      summary: List tasks
      responses:
        "200":
          description: Task list and stats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TaskListResponse"
    post:
      summary: Create a crawl task or queue adapter/verification preparation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CreateTaskResponse"
        "202":
          description: Selector discovery or verification handoff queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CreateTaskResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/tasks/{id}:
    get:
      summary: Read task detail, checkpoint, result, and preview metadata
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/TaskDetailResponse"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a terminal or waiting-verification task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "400":
          $ref: "#/components/responses/Error"
  /api/tasks/{id}/resume:
    post:
      summary: Resume a paused, interrupted, failed, or waiting-verification task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "409":
          description: Human verification handoff is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          $ref: "#/components/responses/Error"
  /api/tasks/{id}/preview-file:
    get:
      summary: Read a downloaded image preview file
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image file stream
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /api/selector-discovery/{id}:
    get:
      summary: Read selector discovery job
      parameters:
        - $ref: "#/components/parameters/DiscoveryId"
      responses:
        "200":
          description: Selector discovery job
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SelectorDiscoveryJob"
        "404":
          $ref: "#/components/responses/Error"
  /api/selector-discovery/{id}/promote:
    post:
      summary: Promote a reviewed TypeScript adapter implementation draft
      parameters:
        - $ref: "#/components/parameters/DiscoveryId"
      responses:
        "200":
          description: Promoted TypeScript adapter implementation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SelectorDiscoveryJob"
        "400":
          $ref: "#/components/responses/Error"
  /api/challenge-discovery/remote/test:
    post:
      summary: Test the active Browser Provider session
      responses:
        "200":
          description: Remote browser connection and page summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/challenge-discovery/{id}:
    get:
      summary: Read a human verification handoff job
      description: Canonical API resource for a human-verification handoff job.
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "200":
          description: Handoff job
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HandoffJob"
        "404":
          $ref: "#/components/responses/Error"
  /api/challenge-discovery/{id}/open-browser:
    post:
      summary: Open the task URL in the configured remote Playwright browser
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "200":
          description: Updated handoff job
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HandoffJob"
        "400":
          $ref: "#/components/responses/Error"
  /api/challenge-discovery/{id}/complete-human-verification:
    post:
      summary: Check whether human verification is complete
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "202":
          description: Updated handoff job
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/HandoffJob"
        "400":
          $ref: "#/components/responses/Error"
  /api/challenge-discovery/{id}/inspect-remote-page:
    post:
      summary: Inspect the matching page in the remote Playwright browser
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "200":
          description: Updated handoff job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/challenge-discovery/{id}/create-selector-discovery-from-remote:
    post:
      summary: Create selector discovery from the matching remote browser page
      parameters:
        - $ref: "#/components/parameters/HandoffId"
      responses:
        "202":
          description: Selector discovery queued from remote browser HTML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          $ref: "#/components/responses/Error"
  /.well-known/comiccrawler-browser-provider:
    get:
      summary: Discover the outbound Browser Provider service contract
      responses:
        "200":
          description: Browser Provider service endpoints
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BrowserProviderServiceDiscovery"
  /api/browser-providers/enrollment-tokens:
    post:
      summary: Create a short-lived one-time browser provider enrollment token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlSeconds:
                  type: integer
                  minimum: 60
                  maximum: 3600
      responses:
        "201":
          description: Enrollment token created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BrowserProviderEnrollmentToken"
  /api/browser-providers/enroll:
    post:
      summary: Exchange a one-time enrollment token for a provider credential
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Provider identity and credential created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BrowserProviderEnrollment"
        "401":
          $ref: "#/components/responses/Error"
  /api/browser-providers:
    get:
      summary: List registered browser providers and the active session
      responses:
        "200":
          description: Enrolled providers, online state, and active session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BrowserProviderRegistryState"
  /api/browser-providers/{providerId}:
    delete:
      summary: Revoke and remove an enrolled browser provider
      parameters:
        - $ref: "#/components/parameters/BrowserProviderId"
      responses:
        "204":
          description: Browser provider removed
        "400":
          $ref: "#/components/responses/Error"
  /api/browser-providers/sessions/active:
    get:
      summary: Read the active browser provider session
      responses:
        "200":
          description: Active browser session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BrowserProviderSession"
        "404":
          $ref: "#/components/responses/Error"
  /api/browser-providers/{providerId}/sessions:
    post:
      summary: Create and activate a negotiated browser provider session
      parameters:
        - $ref: "#/components/parameters/BrowserProviderId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrowserProviderSessionRequest"
      responses:
        "201":
          description: Browser session created and activated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BrowserProviderSession"
        "400":
          $ref: "#/components/responses/Error"
  /api/browser-providers/sessions/{sessionId}/heartbeat:
    post:
      summary: Extend the active browser provider session expiry
      parameters:
        - $ref: "#/components/parameters/BrowserSessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlSeconds:
                  type: integer
                  minimum: 30
                  maximum: 3600
      responses:
        "200":
          description: Renewed browser session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BrowserProviderSession"
        "400":
          $ref: "#/components/responses/Error"
  /api/browser-providers/sessions/{sessionId}:
    delete:
      summary: Close the active browser provider session
      parameters:
        - $ref: "#/components/parameters/BrowserSessionId"
      responses:
        "204":
          description: Browser session closed
        "400":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AdapterId:
      name: id
      in: path
      required: true
      schema:
        type: string
    FunctionId:
      name: functionId
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
    DiscoveryId:
      name: id
      in: path
      required: true
      schema:
        type: string
    HandoffId:
      name: id
      in: path
      required: true
      schema:
        type: string
    BrowserProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
    BrowserSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Message:
      description: Message response
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiResponse"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Message"
  schemas:
    ApiResponse:
      type: object
      required: [data]
      properties:
        data: {}
        error:
          type: string
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        data: {}
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
    CrawlMode:
      type: string
      enum: [all, chapters]
    Capabilities:
      type: object
      properties:
        verification:
          type: boolean
        metadata:
          type: boolean
        chapterImages:
          type: boolean
    BrowserProviderCapabilities:
      type: object
      required: [browser, headed, interactive, persistentContext, screenshots, downloads, tracing, fileTransfer]
      properties:
        browser:
          type: string
          enum: [chromium, firefox, webkit]
        headed:
          type: boolean
        interactive:
          type: boolean
        persistentContext:
          type: boolean
        screenshots:
          type: boolean
        downloads:
          type: boolean
        tracing:
          type: boolean
        fileTransfer:
          type: boolean
    BrowserProviderDescriptor:
      type: object
      required: [contractVersion, providerId, providerType, runtimeVersion, capabilities, transports]
      properties:
        contractVersion:
          type: string
          const: "1"
        providerId:
          type: string
        providerType:
          type: string
          enum: [playwright, cdp]
        runtimeVersion:
          type: string
        capabilities:
          $ref: "#/components/schemas/BrowserProviderCapabilities"
        transports:
          type: array
          items:
            type: string
            enum: [reverse-relay]
    BrowserProviderEnrollmentToken:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
          writeOnly: true
        expiresAt:
          type: string
          format: date-time
    BrowserProviderServiceDiscovery:
      type: object
      required: [contractVersion, transport, endpoints]
      properties:
        contractVersion:
          type: string
          const: "1"
        transport:
          type: string
          const: reverse-relay
        endpoints:
          type: object
          required: [enroll, controlWebSocket, relayWebSocketTemplate]
          properties:
            enroll:
              type: string
              example: /api/browser-providers/enroll
            controlWebSocket:
              type: string
              example: /api/browser-providers/connect
            relayWebSocketTemplate:
              type: string
              example: /api/browser-providers/relay/{tunnelId}
    BrowserProviderEnrollment:
      type: object
      required: [providerId, credentialId, credential, enrolledAt]
      properties:
        providerId:
          type: string
        credentialId:
          type: string
        credential:
          type: string
          writeOnly: true
        enrolledAt:
          type: string
          format: date-time
    BrowserProviderRecord:
      type: object
      required: [providerId, providerName, enrolledAt, online]
      properties:
        providerId:
          type: string
        providerName:
          type: string
        enrolledAt:
          type: string
          format: date-time
        lastConnectedAt:
          type: string
          format: date-time
        online:
          type: boolean
        descriptor:
          $ref: "#/components/schemas/BrowserProviderDescriptor"
    CreateBrowserProviderSessionRequest:
      type: object
      properties:
        requestedCapabilities:
          type: object
          description: Partial capability requirements; session creation fails when the provider cannot satisfy one.
          properties:
            browser:
              type: string
              enum: [chromium, firefox, webkit]
            headed:
              type: boolean
            interactive:
              type: boolean
            persistentContext:
              type: boolean
            screenshots:
              type: boolean
            downloads:
              type: boolean
            tracing:
              type: boolean
            fileTransfer:
              type: boolean
        ttlSeconds:
          type: integer
          minimum: 30
          maximum: 3600
    BrowserProviderSession:
      type: object
      required: [sessionId, providerId, protocol, transport, connectUrl, runtimeVersion, capabilities, createdAt, expiresAt]
      properties:
        sessionId:
          type: string
        providerId:
          type: string
        protocol:
          type: string
          enum: [playwright, cdp]
        transport:
          type: string
          enum: [reverse-relay]
        connectUrl:
          type: string
          format: uri
          description: Short-lived WebSocket URL containing a session ticket.
        viewerUrl:
          type: string
          format: uri
        runtimeVersion:
          type: string
        capabilities:
          $ref: "#/components/schemas/BrowserProviderCapabilities"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    BrowserProviderRegistryState:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/BrowserProviderRecord"
        activeSession:
          oneOf:
            - $ref: "#/components/schemas/BrowserProviderSession"
            - type: "null"
    Adapter:
      type: object
      required: [id, name, domains, parseMode, capabilities]
      properties:
        id:
          type: string
        name:
          type: string
        domains:
          type: array
